<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng từ vựng theo chủ đề</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  /* Bảng màu My Melody Aesthetic */
  --surface: rgba(255, 255, 255, 0.85); 
  --surface-2: rgba(255, 240, 245, 0.95); 
  --ink: #4a4a4a; 
  --muted: #8e8e8e; 
  --line: rgba(255, 182, 193, 0.7); 
  --focus: #ff8fb3; 
  --focus-hover: #ff6b9a; 
  
  --syn: #7bc4c4; 
  --ant: #ff9a9e; 
  
  --c-change: #8bbce6; --c-tech: #b4aee8; --c-pv: #f4a261; --c-col: #d4a5a5; --c-idiom: #e09fbe; --c-wf: #a3c4bc;

  --font-body: "Quicksand", "Nunito", sans-serif;
  --font-head: "Quicksand", "Nunito", sans-serif;
}

html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 130px); scroll-behavior: smooth; }
*, *::before, *::after { box-sizing: inherit; }

body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  /* Hình nền Ghibli (Ponyo) */
  background: url('https://static0.moviewebimages.com/wordpress/wp-content/uploads/2023/02/ponyo-2008-1.jpg') no-repeat center center fixed;
  background-size: cover;
}

/* Lớp phủ filter hồng đào */
body::after {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255, 240, 245, 0.15);
  pointer-events: none;
  z-index: -1;
}

/* Widget Pinterest lơ lửng ở góc */
.melody-widget {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  transform: scale(0.65); 
  transform-origin: bottom right;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 15px 35px rgba(255, 143, 179, 0.4);
  animation: floatWidget 4s ease-in-out infinite;
}

@keyframes floatWidget {
  0%, 100% { transform: scale(0.65) translateY(0); }
  50% { transform: scale(0.65) translateY(-12px); }
}

a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 12px;}

header.top { 
  max-width: 1360px; 
  margin: 10px auto 0; 
  padding: 12px 18px; 
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px 24px;
  background: var(--surface);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-radius: 16px; 
  border: 2px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 5px 16px rgba(74, 74, 74, 0.08); 
}
.header-copy { min-width: 0; }
header.top h1 { 
  font-family: var(--font-head); 
  font-size: 1.4rem; 
  font-weight: 800; 
  line-height: 1.2; 
  margin: 0; 
  color: var(--focus-hover); 
  text-shadow: none;
}
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 3px; font-size: .78rem; color: var(--muted); font-weight: 700; }
.legend span b { color: var(--focus-hover); }

.bar {
  position: sticky; top: 10px; z-index: 10;
  max-width: 1360px; margin: 10px auto 16px;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-radius: 14px;
  border: 2px solid rgba(255,255,255,0.9);
  box-shadow: 0 5px 16px rgba(74, 74, 74, 0.07);
}
.bar-in { padding: 8px 14px; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 14px; align-items: center; }

/* CSS Dropdown Menu */
.dropdown-wrapper { 
  position: relative; 
  display: inline-block; 
}
.topics-btn { 
  font: inherit; font-size: .95rem; font-weight: 800; 
  padding: 8px 20px; 
  border-radius: 20px; 
  border: 2px solid rgba(255, 182, 193, 0.6); 
  background: var(--focus); 
  color: #fff; 
  cursor: pointer; 
  transition: all 0.3s ease; 
  box-shadow: 0 4px 12px rgba(255, 143, 179, 0.3); 
  display: flex;
  align-items: center;
  gap: 8px;
}
.topics-btn:hover { background: var(--focus-hover); transform: translateY(-2px); }
.topics-btn::after {
  content: "▾";
  font-size: 1rem;
  opacity: 0.9;
}
.topics-dropdown {
  display: none;
  position: absolute;
  top: 115%;
  left: 0;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  min-width: 260px;
  border-radius: 18px;
  border: 2px solid rgba(255, 182, 193, 0.6);
  box-shadow: 0 10px 25px rgba(255, 182, 193, 0.25);
  padding: 8px;
  z-index: 100;
  flex-direction: column;
  gap: 6px;
}
.topics-dropdown.show { display: flex; }
.topics-dropdown button {
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: .9rem;
  font-weight: 700;
  padding: 10px 14px;
  border-radius: 12px;
  border: none;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s ease;
}
.topics-dropdown button:hover { background: var(--surface-2); color: var(--focus-hover); transform: translateX(2px); }
.topics-dropdown button[aria-pressed="true"] {
  background: linear-gradient(135deg, rgba(255, 143, 179, 0.18), rgba(255, 240, 245, 1));
  color: var(--focus-hover);
  font-weight: 800;
  box-shadow: inset 0 0 0 1px rgba(255, 143, 179, 0.2);
}

.nav { min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; margin-left: 10px; padding-left: 15px; border-left: 2px dashed var(--line); }
.nav a { 
  text-decoration: none; font-size: .9rem; font-weight: 700; 
  padding: 6px 16px; border-radius: 999px; 
  border: 2px solid transparent; color: var(--ink); 
  background: rgba(255,240,245,0.8); 
  transition: all 0.2s ease; 
}
.nav a:hover { border-color: var(--c); color: var(--c); background: #fff; transform: translateY(-1px); }

main { max-width: 1360px; margin: 0 auto; padding: 0 0 60px; }
section { margin-top: 50px; }
section h2 { 
  font-family: var(--font-head); font-size: 1.8rem; font-weight: 800; 
  margin: 0 0 8px; padding-left: 16px; 
  border-left: 8px solid var(--c); 
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; 
  text-shadow: 0 2px 4px rgba(255,255,255,0.8); 
  border-radius: 4px;
}
section h2 small { font-family: var(--font-body); font-weight: 700; font-size: 1rem; color: var(--focus-hover); background: rgba(255,255,255,0.9); padding: 2px 10px; border-radius: 12px; border: 1px solid var(--line);}
section .lede { 
  margin: 0 0 20px 24px; color: var(--ink); font-weight: 600; font-size: 1.05rem; max-width: 80ch; 
  background: rgba(255,255,255,0.7); padding: 8px 16px; border-radius: 16px; 
  display: inline-block; backdrop-filter: blur(5px);
  border: 1px solid rgba(255,255,255,0.5);
}

.wrap {
  overflow-x: auto;
  border: 2px solid rgba(255,255,255,0.9);
  border-radius: 24px;
  background: var(--surface);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 15px 35px rgba(255, 182, 193, 0.15); 
}
table { border-collapse: collapse; width: 100%; min-width: 1180px; font-size: .95rem; }
thead th { 
  position: sticky; top: 0; 
  background: rgba(255, 240, 245, 0.95); 
  text-align: left; font-weight: 800; padding: 16px 18px; 
  border-bottom: 3px solid var(--c); white-space: nowrap; color: var(--ink); 
  z-index: 2; font-size: 1rem;
}
tbody td { padding: 14px 18px; vertical-align: top; border-bottom: 1px dashed var(--line); transition: background 0.2s ease; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }

td.w { 
  position: sticky; left: 0; 
  background: rgba(255, 255, 255, 0.95); 
  min-width: 140px; max-width: 200px; 
  border-right: 2px dashed rgba(255, 182, 193, 0.4); 
  z-index: 1;
}
tbody tr:hover td.w { background: rgba(255, 245, 248, 1); }
td.w .hw { font-family: var(--font-head); font-weight: 800; font-size: 1.2rem; color: var(--c); line-height: 1.3; overflow-wrap: anywhere; }
td.w .pos { font-style: italic; color: var(--muted); font-size: .85rem; font-weight: 700; margin-top: 4px; display: inline-block; background: rgba(255, 240, 245, 0.8); padding: 2px 8px; border-radius: 8px;}
td.w .phonetic { font-family: var(--font-body); color: var(--focus-hover); font-size: .9rem; font-weight: 800; margin-top: 6px; }
td .vi { margin-top: 6px; font-weight: 800; color: var(--ink); font-size: 1.05rem;}

td .tag { 
  display: inline-block; font-weight: 800; font-size: .8rem; margin-right: 6px; 
  background: rgba(255,255,255,0.9); padding: 3px 10px; border-radius: 12px; 
  border: 1px solid rgba(255, 182, 193, 0.4); 
  box-shadow: 0 2px 4px rgba(255,182,193,0.1);
}
td .tag.s { color: var(--syn); }
td .tag.a { color: var(--ant); }

td div + div { margin-top: 8px; }
td ul.ph { margin: 0; padding-left: 20px; }
td ul.ph li { margin-bottom: 6px; font-weight: 600; }
td ul.ph li::marker { color: var(--focus-hover); }
td b { font-weight: 800; color: var(--ink); }

td.ex { 
  font-style: italic; color: #5a5a5a; font-weight: 600; 
  background: rgba(255, 250, 250, 0.7); 
  padding: 10px 14px; border-radius: 12px; 
  display: inline-block; width: 100%; box-sizing: border-box;
  border-left: 3px solid var(--focus);
}
td.ex b { font-style: normal; color: var(--focus-hover); font-weight: 800; }

th.c-m, td.c-m { min-width: 250px; }
th.c-s, td.c-s { min-width: 190px; }
th.c-e, td.c-e { min-width: 250px; }
th.c-c, td.c-c { min-width: 230px; }
th.c-n, td.c-n { min-width: 250px; }

::-webkit-scrollbar { width: 14px; height: 14px; }
::-webkit-scrollbar-track { background: rgba(255, 240, 245, 0.6); border-radius: 14px; margin: 6px;}
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--focus), var(--focus-hover)); border-radius: 14px; border: 4px solid rgba(255, 240, 245, 0.8); }
::-webkit-scrollbar-thumb:hover { background: #ff5285; }

.view-tabs {
  margin: 0;
  padding: 0;
  display: flex;
  gap: 4px;
}
.view-tabs button, .mode-tabs button, .difficulty-tabs button {
  font: inherit;
  font-weight: 800;
  color: var(--ink);
  cursor: pointer;
}
.view-tabs button {
  padding: 7px 14px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
}
.view-tabs button[aria-selected="true"] {
  color: var(--focus-hover);
  background: rgba(255, 143, 179, 0.13);
  border-color: rgba(255, 143, 179, 0.28);
}
.view-panel[hidden], .activity-panel[hidden] { display: none !important; }
.study-view {
  max-width: 1360px;
  margin: 20px auto 60px;
  padding: 24px;
  background: var(--surface);
  backdrop-filter: blur(16px);
  border: 2px solid rgba(255, 255, 255, 0.9);
  border-radius: 24px;
  box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15);
}
.study-controls, .activity-heading, .activity-actions, .writing-footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
}
.study-controls { margin-bottom: 22px; }
.study-controls label, .writing-label { font-weight: 800; }
.study-controls select {
  min-width: 230px;
  max-width: 100%;
  padding: 9px 36px 9px 14px;
  font: inherit;
  font-weight: 700;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.92);
  border: 2px solid var(--line);
  border-radius: 12px;
}
.study-progress { margin-left: auto; color: var(--muted); font-weight: 700; }
.mode-tabs, .difficulty-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.mode-tabs { margin-bottom: 20px; border-bottom: 1px solid var(--line); }
.mode-tabs button, .difficulty-tabs button {
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.75);
}
.mode-tabs button[aria-selected="true"], .difficulty-tabs button[aria-pressed="true"] {
  color: #fff;
  border-color: var(--focus-hover);
  background: var(--focus-hover);
}
.activity-heading { justify-content: space-between; margin-bottom: 14px; }
.activity-heading h2, .writing-prompt h2 { margin: 0; font-size: 1.35rem; color: var(--focus-hover); }
.activity-heading span { color: var(--muted); font-weight: 800; }
.study-card {
  max-width: 760px;
  min-height: 250px;
  margin: 0 auto 18px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  background: rgba(255, 255, 255, 0.92);
  border: 2px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 10px 28px rgba(255, 143, 179, 0.12);
}
.study-term { font-family: var(--font-head); font-size: 2rem; font-weight: 800; color: var(--focus-hover); overflow-wrap: anywhere; }
.study-meta { margin-top: 4px; color: var(--muted); font-weight: 700; }
.study-answer { max-width: 58ch; margin: 18px auto 0; font-size: 1.05rem; white-space: pre-line; }
.activity-actions { justify-content: center; }
.activity-actions button, #quiz-next, #reading-next {
  padding: 9px 16px;
  font: inherit;
  font-weight: 800;
  color: #fff;
  border: 1px solid var(--focus-hover);
  border-radius: 12px;
  background: var(--focus);
  cursor: pointer;
}
.activity-actions button:hover, #quiz-next:hover, #reading-next:hover { background: var(--focus-hover); }
.difficulty-tabs { margin-bottom: 18px; }
.quiz-prompt {
  max-width: 850px;
  margin: 0 0 16px;
  font-size: 1.1rem;
  font-weight: 700;
}
.quiz-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 900px; }
.quiz-options button {
  min-height: 52px;
  padding: 12px 16px;
  text-align: left;
  font: inherit;
  font-weight: 700;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.88);
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
}
.quiz-options button:hover:not(:disabled) { border-color: var(--focus-hover); background: var(--surface-2); }
.quiz-options button:disabled { cursor: default; opacity: 0.82; }
.quiz-options button.correct { border-color: #58a99a; background: rgba(123, 196, 196, 0.25); }
.quiz-options button.incorrect { border-color: #e17680; background: rgba(255, 154, 158, 0.25); }
.quiz-feedback { min-height: 1.6em; font-weight: 800; }
.reading-article {
  max-width: 980px;
  margin: 0 auto 28px;
  padding: 24px 30px;
  background: rgba(255, 255, 255, 0.78);
  border-left: 6px solid var(--c-change);
  border-radius: 16px;
}
.reading-kicker { color: var(--focus-hover); font-size: .88rem; font-weight: 800; text-transform: uppercase; }
.reading-article h2 { margin: 4px 0; font-family: var(--font-head); font-size: 1.6rem; color: var(--ink); }
.reading-level-label { margin: 0 0 18px; color: var(--muted); font-weight: 700; }
.reading-passage { max-width: 78ch; font-size: 1.04rem; line-height: 1.8; }
.reading-passage p { margin: 0 0 14px; }
.reading-passage p:last-child { margin-bottom: 0; }
.reading-quiz { padding-top: 20px; border-top: 1px solid var(--line); }

@media (max-width:900px){
  header.top { margin: 10px; padding: 12px 14px; flex-wrap: wrap; }
  .header-copy { flex: 1 1 100%; }
  .view-tabs { max-width: 100%; overflow-x: auto; }
  .view-tabs button { white-space: nowrap; }
  .study-view { margin: 10px; padding: 18px; border-radius: 20px; }
  .study-controls select { flex: 1 1 100%; }
  .study-progress { margin-left: 0; }
  .quiz-options { grid-template-columns: 1fr; }
  .study-card { min-height: 220px; padding: 20px; }
  .bar-in { display: flex; flex-wrap: wrap; padding: 8px 10px; }
  .bar { margin: 10px; border-radius: 14px; top: 8px;}
  .nav { border-left: none; padding-left: 0; margin-left: 0; width: 100%; }
  .wrap { border: 0; background: transparent; overflow: visible; box-shadow: none; backdrop-filter: none; }
  table, thead, tbody, tr, td { display: block; min-width: 0; width: 100%; }
  thead { display: none; }
  tbody tr { 
    background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); 
    border: 2px solid rgba(255, 255, 255, 0.9); border-left: 8px solid var(--c); 
    border-radius: 24px; margin-bottom: 20px; padding: 12px 0; 
    box-shadow: 0 8px 20px rgba(255, 182, 193, 0.2); 
  }
  tbody td { border: 0; padding: 10px 20px; min-width: 0!important; max-width: none!important; }
  td.w { position: static; border: 0; background: transparent; padding-bottom: 0;}
  tbody tr:hover td, tbody tr:hover td.w { background: transparent; }
  td[data-l]::before { 
    content: attr(data-l); display: block; font-size: .85rem; font-weight: 800; 
    color: var(--focus-hover); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .melody-widget {
    transform: scale(0.4); 
    bottom: 10px;
    right: 10px;
  }
  @keyframes floatWidget {
    0%, 100% { transform: scale(0.4) translateY(0); }
    50% { transform: scale(0.4) translateY(-8px); }
  }
}
</style>
</head>
<body>
<header class="top">
  <div class="header-copy">
    <h1>Tổng hợp từ vựng B2 theo chủ đề</h1>
    <div class="legend">
      <span><b>Syn.</b> đồng nghĩa hoặc gần nghĩa</span>
      <span><b>Ant.</b> trái nghĩa hoặc đối lập</span>
    </div>
  </div>
  <nav class="view-tabs" role="tablist" aria-label="Khu vực học">
    <button id="tab-vocabulary" type="button" role="tab" aria-selected="true" aria-controls="view-vocabulary">Từ vựng</button>
    <button id="tab-review" type="button" role="tab" aria-selected="false" aria-controls="view-review">Ôn tập</button>
    <button id="tab-reading" type="button" role="tab" aria-selected="false" aria-controls="view-reading">Reading</button>
  </nav>
</header>

<div id="view-vocabulary" class="view-panel" role="tabpanel" aria-labelledby="tab-vocabulary">
<div class="bar">
  <div class="bar-in">
    <div id="topics" role="group" aria-label="Chủ đề"></div>
    <nav class="nav" id="nav" aria-label="Các phần"></nav>
  </div>
</div>

<main id="app"></main>
</div>

<section id="view-review" class="view-panel study-view" role="tabpanel" aria-labelledby="tab-review" hidden>
  <div class="study-controls">
    <label for="study-unit">Unit</label>
    <select id="study-unit"></select>
    <span id="study-progress" class="study-progress" aria-live="polite"></span>
  </div>
  <div class="mode-tabs" role="tablist" aria-label="Chế độ ôn tập">
    <button id="mode-cards" type="button" role="tab" aria-selected="true" aria-controls="review-cards">Flashcard</button>
    <button id="mode-quiz" type="button" role="tab" aria-selected="false" aria-controls="review-quiz">Quiz</button>
  </div>
  <div id="review-cards" class="activity-panel" role="tabpanel" aria-labelledby="mode-cards">
    <div class="activity-heading"><h2>Flashcard</h2><span id="card-position" aria-live="polite"></span></div>
    <article class="study-card" aria-live="polite">
      <div id="card-term" class="study-term"></div>
      <div id="card-meta" class="study-meta"></div>
      <div id="card-answer" class="study-answer" hidden></div>
    </article>
    <div class="activity-actions">
      <button id="card-reveal" type="button">Hiện đáp án</button>
      <button id="card-review" type="button" hidden>Ôn lại</button>
      <button id="card-known" type="button" hidden>Đã nhớ</button>
      <button id="card-next" type="button" hidden>Thẻ tiếp theo</button>
    </div>
  </div>
  <div id="review-quiz" class="activity-panel" role="tabpanel" aria-labelledby="mode-quiz" hidden>
    <div class="activity-heading"><h2>Quiz</h2><span id="quiz-score" aria-live="polite"></span></div>
    <div class="difficulty-tabs" role="group" aria-label="Mức độ quiz">
      <button type="button" data-level="basic" aria-pressed="true">Cơ bản</button>
      <button type="button" data-level="intermediate" aria-pressed="false">Trung cấp</button>
      <button type="button" data-level="advanced" aria-pressed="false">Vận dụng</button>
    </div>
    <div id="quiz-prompt" class="quiz-prompt" aria-live="polite"></div>
    <div id="quiz-options" class="quiz-options"></div>
    <p id="quiz-feedback" class="quiz-feedback" aria-live="polite"></p>
    <button id="quiz-next" type="button" hidden>Câu tiếp theo</button>
  </div>

function fmt(s){ return s.split('|').map(x => x.replace(/\*(.+?)\*/g,'<b>$1</b>')).join('<br>'); }
function items(s){
  return '<ul class="ph">' + s.split('¦').map(x => {
    const i = x.indexOf(' = ');
    return i < 0 ? '<li><b>'+x+'</b></li>' : '<li><b>'+x.slice(0,i)+'</b> — '+x.slice(i+3)+'</li>';
  }).join('') + '</ul>';
}
function synant(syn, ant){
  let h = '';
  if (syn) h += '<div><span class="tag s">Syn.</span>'+syn+'</div>';
  if (ant) h += '<div><span class="tag a">Ant.</span>'+ant+'</div>';
  return h || '<span style="color:var(--muted)">—</span>';
}
function headCells(cols){ return '<tr>'+cols.map(c => '<th class="'+(c[1]||'')+'">'+c[0]+'</th>').join('')+'</tr>'; }

function buildSection(topicId, sec){
  let head, rowsHtml;
  if (sec.type === 'formation') {
    head = headCells([["Từ gốc",""],["Họ từ","c-m"],["Nghĩa và cách dùng","c-n"]]);
    rowsHtml = sec.data.map(r =>
      '<tr><td class="w" data-l="Từ gốc"><div class="hw">'+r[0]+'</div></td>'+
      '<td class="c-m" data-l="Họ từ">'+items(r[1])+'</td>'+ 
      '<td class="c-n" data-l="Nghĩa và cách dùng">'+r[2]+'</td></tr>').join('');
  } else if (sec.type === 'wp') {
    head = headCells([["Từ gốc",""],["Cấu trúc đi kèm (Word Patterns)","c-m"],["Ví dụ","c-e"],["Lưu ý và phân biệt","c-n"]]);
    rowsHtml = sec.data.map(r =>
      '<tr><td class="w" data-l="Từ gốc"><div class="hw">'+r[0]+'</div></td>'+
      '<td class="c-m" data-l="Cấu trúc đi kèm">'+items(r[1])+'</td>'+
      '<td class="c-e ex" data-l="Ví dụ">'+fmt(r[2])+'</td>'+
      '<td class="c-n" data-l="Lưu ý">'+r[3]+'</td></tr>').join('');
  } else {
    const meaningLabel = sec.type === 'phrases' ? 'Cụm trong sách (Anh – Việt)' : 'Nghĩa (Anh – Việt)';
    head = headCells([
      [sec.type === 'phrases' ? 'Từ khóa' : 'Từ',""],
      [meaningLabel,"c-m"],["Synonyms / Antonyms","c-s"],["Ví dụ","c-e"],["Collocations","c-c"],["Sắc thái và ngữ cảnh","c-n"]]);
    
    rowsHtml = sec.data.map(r => {
      const meaning = sec.type === 'phrases'
        ? items(r[2])
        : '<div>'+r[2]+'</div><div class="vi">'+r[3]+'</div>';
        
      const posHtml = r[1] ? '<div class="pos">'+r[1]+'</div>' : '';
      const phoneticHtml = (sec.type === 'vocab' && r[9]) ? '<div class="phonetic">'+r[9]+'</div>' : '';

      return '<tr><td class="w" data-l="'+(sec.type==='phrases'?'Từ khóa':'Từ')+'"><div class="hw">'+r[0]+'</div>'+ phoneticHtml + posHtml+'</td>'+
        '<td class="c-m" data-l="'+meaningLabel+'">'+meaning+'</td>'+
        '<td class="c-s" data-l="Synonyms / Antonyms">'+synant(r[4], r[5])+'</td>'+
        '<td class="c-e ex" data-l="Ví dụ">'+fmt(r[6])+'</td>'+
        '<td class="c-c" data-l="Collocations">'+r[7]+'</td>'+
        '<td class="c-n" data-l="Sắc thái và ngữ cảnh">'+r[8]+'</td></tr>';
    }).join('');
  }
  const el = document.createElement('section');
  el.id = topicId + '-' + sec.id;
  el.style.setProperty('--c', 'var('+sec.cls+')');
  el.innerHTML =
    '<h2>'+sec.title+' <small>'+sec.data.length+' mục</small></h2>'+
    '<p class="lede">'+sec.lede+'</p>'+
    '<div class="wrap"><table><thead>'+head+'</thead><tbody>'+rowsHtml+'</tbody></table></div>';
  return el;
}

TOPICS.forEach(t => {
  const box = document.createElement('div');
  box.className = 'topic';
  box.dataset.topic = t.id;
  t.sections.forEach(sec => box.appendChild(buildSection(t.id, sec)));
  app.appendChild(box);

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = t.name;
  btn.dataset.topic = t.id;
  btn.setAttribute('aria-pressed', String(t.id === current));
  btn.addEventListener('click', () => {
    setTopic(t.id);
    dropdownContent.classList.remove('show');
    mainBtn.setAttribute('aria-expanded', 'false');
    TOPICS.forEach(item => {
      const target = dropdownContent.querySelector('[data-topic="' + item.id + '"]');
      if (target) target.setAttribute('aria-pressed', String(item.id === t.id));
    });
  });
  dropdownContent.appendChild(btn);
});

function buildNav(){
  const t = TOPICS.find(x => x.id === current);
  nav.innerHTML = t.sections.map(s =>
    '<a href="#'+t.id+'-'+s.id+'" style="--c:var('+s.cls+')">'+s.navLabel+'</a>').join('');
}

function setTopic(id){
  current = id;
  buildNav();
  TOPICS.forEach(item => {
    const btn = dropdownContent.querySelector('[data-topic="' + item.id + '"]');
    if (btn) btn.setAttribute('aria-pressed', String(item.id === id));
  });
  run();
  window.scrollTo({top:0});
}

function run(){
  document.querySelectorAll('.topic').forEach(tp => {
    tp.style.display = tp.dataset.topic === current ? '' : 'none';
  });
}

const storageKeys = {progress: 'vocabStudyProgress'};

function readStorage(key, fallback){
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch (error) {
    return fallback;
  }
}
function writeStorage(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (error) {}
}

let savedProgress = readStorage(storageKeys.progress, {});
function progressFor(unitId){
  if (!savedProgress[unitId]) savedProgress[unitId] = {known: [], best: {}};
  if (!Array.isArray(savedProgress[unitId].known)) savedProgress[unitId].known = [];
  if (!savedProgress[unitId].best) savedProgress[unitId].best = {};
  return savedProgress[unitId];
}
function saveProgress(){ writeStorage(storageKeys.progress, savedProgress); }
function shuffle(list){
  const result = list.slice();
  for (let i = result.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
function wordBank(unitId){
  const topic = TOPICS.find(item => item.id === unitId);
  if (!topic) return [];
  return topic.sections.filter(section => section.type === 'vocab').flatMap(section =>
    section.data.map(row => ({
      term: String(row[0] || ''),
      pos: String(row[1] || ''),
      definition: String(row[2] || ''),
      meaning: String(row[3] || row[2] || ''),
      synonyms: String(row[4] || ''),
      antonyms: String(row[5] || ''),
      example: String(row[6] || ''),
      collocations: String(row[7] || ''),
      nuance: String(row[8] || '')
    }))
  ).filter(item => item.term);
}

function selectUnitOptions(select){
  TOPICS.forEach(topic => {
    const option = document.createElement('option');
    option.value = topic.id;
    option.textContent = topic.name;
    select.appendChild(option);
  });
  select.value = current;
}

const cardTerm = document.getElementById('card-term');
const cardMeta = document.getElementById('card-meta');
const cardAnswer = document.getElementById('card-answer');
const cardPosition = document.getElementById('card-position');
const cardReveal = document.getElementById('card-reveal');
const cardReview = document.getElementById('card-review');
const cardKnown = document.getElementById('card-known');
let cardQueue = [];
let cardRetry = [];
let cardIndex = 0;

function updateStudyProgress(){
  const bank = wordBank(studyUnit.value);
  const progress = progressFor(studyUnit.value);
  const best = Object.values(progress.best).filter(Number.isFinite);
  const bestText = best.length ? ' · Quiz tốt nhất ' + Math.max(...best) + '/10' : '';
  document.getElementById('study-progress').textContent =
    progress.known.length + '/' + bank.length + ' từ đã nhớ' + bestText;
}
function renderCard(){
  const cardNext = document.getElementById('card-next');
  if (cardIndex >= cardQueue.length && cardRetry.length){
    cardQueue = shuffle(cardRetry).map(item => ({...item, retryRound: true}));
    cardRetry = [];
    cardIndex = 0;
  }
  if (!cardQueue.length || cardIndex >= cardQueue.length){
    cardTerm.textContent = 'Hoàn tất lượt ôn';
    cardMeta.textContent = '';
    cardAnswer.textContent = 'Bạn đã xem hết các thẻ trong lượt này.';
    cardAnswer.hidden = false;
    cardPosition.textContent = '';
    cardReveal.hidden = true;
    cardReview.hidden = true;
    cardKnown.hidden = true;
    cardNext.hidden = true;
    updateStudyProgress();
    return;
  }
  const item = cardQueue[cardIndex];
  const retryRound = Boolean(item.retryRound);
  cardTerm.textContent = item.term;
  cardMeta.textContent = item.pos;
  cardAnswer.textContent = [item.meaning, item.definition, item.example.replace(/\*(.*?)\*/g, '$1'), item.collocations]
    .filter(Boolean).join('\n');
  cardAnswer.hidden = true;
  cardPosition.textContent = (retryRound ? 'Ôn lại · ' : '') + (cardIndex + 1) + '/' + cardQueue.length;
  cardReveal.hidden = false;
  cardReview.hidden = true;
  cardKnown.hidden = true;
  cardNext.hidden = true;
  updateStudyProgress();
}
function startCards(){
  cardQueue = shuffle(wordBank(studyUnit.value));
  cardRetry = [];
  cardIndex = 0;
  renderCard();
}
cardReveal.addEventListener('click', () => {
  cardAnswer.hidden = false;
  cardReveal.hidden = true;
  cardReview.hidden = false;
  cardKnown.hidden = false;
});
cardReview.addEventListener('click', () => {
  if (cardQueue[cardIndex]) cardRetry.push(cardQueue[cardIndex]);
  cardIndex++;
  renderCard();
});
cardKnown.addEventListener('click', () => {
  const progress = progressFor(studyUnit.value);
  const term = cardQueue[cardIndex] && cardQueue[cardIndex].term;
  if (term && !progress.known.includes(term)) progress.known.push(term);
  saveProgress();
  cardIndex++;
  renderCard();
});

const quizPrompt = document.getElementById('quiz-prompt');
const quizOptions = document.getElementById('quiz-options');
const quizFeedback = document.getElementById('quiz-feedback');
const quizScore = document.getElementById('quiz-score');
const quizNext = document.getElementById('quiz-next');
let quizLevel = 'basic';
let quizRound = [];
let quizIndex = 0;
let quizCorrect = 0;
let quizAnswered = false;
let quizFinished = false;

function choiceLabel(item){
  return quizLevel === 'basic' ? (item.meaning || item.definition) : item.term;
}
function makeChoices(answer){
  const choices = [answer];
  const labels = new Set([choiceLabel(answer)]);
  shuffle(wordBank(studyUnit.value).filter(item => item !== answer)).some(item => {
    const label = choiceLabel(item);
    if (label && !labels.has(label)){
      labels.add(label);
      choices.push(item);
    }
    return choices.length === 4;
  });
  return shuffle(choices);
}
function renderQuizQuestion(){
  quizAnswered = false;
  quizNext.hidden = true;
  quizFeedback.textContent = '';
  quizOptions.replaceChildren();
  if (!quizRound.length){
    quizPrompt.textContent = 'Unit này chưa có từ để luyện.';
    quizScore.textContent = '';
    return;
  }
  if (quizFinished){
    quizPrompt.textContent = 'Hoàn thành lượt quiz!';
    quizFeedback.textContent = 'Bạn trả lời đúng ' + quizCorrect + '/' + quizRound.length + ' câu.';
    quizNext.textContent = 'Làm lượt mới';
    quizNext.hidden = false;
    return;
  }
  const item = quizRound[quizIndex];
  quizScore.textContent = 'Câu ' + (quizIndex + 1) + '/' + quizRound.length + ' · đúng ' + quizCorrect;
  if (quizLevel === 'basic'){
    quizPrompt.textContent = '“' + item.term + '” có nghĩa nào?';
  } else if (quizLevel === 'intermediate'){
    const cloze = item.example.replace(/\*(.*?)\*/g, '_____');
    quizPrompt.textContent = cloze !== item.example ? cloze : 'Chọn từ phù hợp với câu: ' + item.example;
  } else {
    quizPrompt.textContent = 'Chọn từ/cụm phù hợp với mô tả: ' + (item.nuance || item.definition || item.meaning);
  }
  makeChoices(item).forEach(choice => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = choiceLabel(choice);
    button.addEventListener('click', () => answerQuiz(button, choice, item));
    quizOptions.appendChild(button);
  });
}
function startQuiz(){
  quizRound = shuffle(wordBank(studyUnit.value)).slice(0, 10);
  quizIndex = 0;
  quizCorrect = 0;
  quizFinished = false;
  quizNext.textContent = 'Câu tiếp theo';
  renderQuizQuestion();
}
function answerQuiz(button, choice, answer){
  if (quizAnswered) return;
  quizAnswered = true;
  const correct = choice === answer;
  if (correct) quizCorrect++;
  quizOptions.querySelectorAll('button').forEach(option => {
    option.disabled = true;
    if (option.textContent === choiceLabel(answer)) option.classList.add('correct');
  });
  if (!correct) button.classList.add('incorrect');
  quizFeedback.textContent = correct
    ? 'Chính xác! ' + (answer.nuance || answer.meaning)
    : 'Chưa đúng. Đáp án: ' + answer.term + ' · ' + answer.meaning;
  quizScore.textContent = 'Câu ' + (quizIndex + 1) + '/' + quizRound.length + ' · đúng ' + quizCorrect;
  quizNext.textContent = quizIndex === quizRound.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo';
  quizNext.hidden = false;
}
quizNext.addEventListener('click', () => {
  if (quizFinished){ startQuiz(); return; }
  if (!quizAnswered) return;
  if (quizIndex === quizRound.length - 1){
    quizFinished = true;
    const progress = progressFor(studyUnit.value);
    progress.best[quizLevel] = Math.max(progress.best[quizLevel] || 0, quizCorrect);
    saveProgress();
    updateStudyProgress();
  } else {
    quizIndex++;
  }
  renderQuizQuestion();
});
document.querySelectorAll('.difficulty-tabs button').forEach(button => {
  button.addEventListener('click', () => {
    quizLevel = button.dataset.level;
    document.querySelectorAll('.difficulty-tabs button').forEach(option =>
      option.setAttribute('aria-pressed', String(option === button)));
    startQuiz();
  });
});

let readingQuestions = [];
let readingIndex = 0;
let readingCorrect = 0;
let readingAnswered = false;
let readingFinished = false;

function renderReadingQuestion(){
  const readingNext = document.getElementById('reading-next');
  const readingQuestion = document.getElementById('reading-question');
  const readingOptions = document.getElementById('reading-options');
  const readingFeedback = document.getElementById('reading-feedback');
  const readingProgress = document.getElementById('reading-progress');
  readingOptions.replaceChildren();
  readingFeedback.textContent = '';
  readingNext.hidden = true;
  if (readingFinished){
    readingProgress.textContent = 'Hoàn thành';
    readingQuestion.textContent = 'Bạn trả lời đúng ' + readingCorrect + '/' + readingQuestions.length + ' câu.';
    readingFeedback.textContent = 'Hãy đọc lại bài và thử giải thích bằng lời của bạn vì sao các đáp án đúng.';
    readingNext.textContent = 'Làm lại bài đọc';
    readingNext.hidden = false;
    return;
  }
  const item = readingQuestions[readingIndex];
  if (!item){
    readingQuestion.textContent = 'Bài đọc này chưa có câu hỏi.';
    readingProgress.textContent = '';
    return;
  }
  readingProgress.textContent = 'Câu ' + (readingIndex + 1) + '/' + readingQuestions.length + ' · đúng ' + readingCorrect;
  readingQuestion.textContent = item.prompt;
  item.options.forEach((label, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', () => {
      if (readingAnswered) return;
      readingAnswered = true;
      const isCorrect = index === item.answer;
      if (isCorrect) readingCorrect++;
      readingOptions.querySelectorAll('button').forEach((option, optionIndex) => {
        option.disabled = true;
        if (optionIndex === item.answer) option.classList.add('correct');
      });
      if (!isCorrect) button.classList.add('incorrect');
      readingFeedback.textContent = (isCorrect ? 'Chính xác. ' : 'Chưa đúng. ') + item.explanation;
      readingProgress.textContent = 'Câu ' + (readingIndex + 1) + '/' + readingQuestions.length + ' · đúng ' + readingCorrect;
      readingNext.textContent = readingIndex === readingQuestions.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo';
      readingNext.hidden = false;
    });
    readingOptions.appendChild(button);
  });
}

function loadReading(){
  const topic = TOPICS.find(item => item.id === readingUnit.value);
  const baseText = READING_LIBRARY[readingUnit.value] && READING_LIBRARY[readingUnit.value][readingLevel.value];
  const extension = READING_EXAM_EXTENSIONS[readingUnit.value] && READING_EXAM_EXTENSIONS[readingUnit.value][readingLevel.value];
  const text = baseText && extension ? {
    ...baseText,
    passage: baseText.passage + '\n\n' + extension.passage,
    questions: baseText.questions.concat(extension.questions)
  } : baseText;
  document.getElementById('reading-unit-title').textContent = topic ? topic.name : '';
  document.getElementById('reading-level-label').textContent = readingLevel.value.toUpperCase() + ' · Đọc bài và chọn đáp án phù hợp';
  document.getElementById('reading-title').textContent = text ? text.title : 'Chưa có bài đọc';
  const passage = document.getElementById('reading-passage');
  passage.replaceChildren();
  if (text){
    text.passage.split(/\n\s*\n/).forEach(paragraph => {
      const element = document.createElement('p');
      element.textContent = paragraph;
      passage.appendChild(element);
    });
  }
  readingQuestions = text ? text.questions : [];
  readingIndex = 0;
  readingCorrect = 0;
  readingAnswered = false;
  readingFinished = false;
  renderReadingQuestion();
}

document.getElementById('reading-next').addEventListener('click', () => {
  if (readingFinished){ loadReading(); return; }
  if (!readingAnswered) return;
  if (readingIndex === readingQuestions.length - 1){
    readingFinished = true;
  } else {
    readingIndex++;
  }
  readingAnswered = false;
  renderReadingQuestion();
});
readingUnit.addEventListener('change', () => setTopic(readingUnit.value));
readingLevel.addEventListener('change', loadReading);

function syncUnitSelects(unitId){
  studyUnit.value = unitId;
  readingUnit.value = unitId;
  originalSetTopic(unitId);
  startCards();
  startQuiz();
  loadReading();
  updateStudyProgress();
}
const originalSetTopic = setTopic;
setTopic = function(id){
  syncUnitSelects(id);
};
studyUnit.addEventListener('change', () => setTopic(studyUnit.value));

startCards();
startQuiz();
loadReading();
updateStudyProgress();
