<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng từ vựng theo chủ đề</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  /* Bảng màu My Melody Aesthetic */
  --surface: rgba(255, 255, 255, 0.85); 
  --surface-2: rgba(255, 240, 245, 0.95); 
  --ink: #4a4a4a; 
  --muted: #8e8e8e; 
  --line: rgba(255, 182, 193, 0.7); 
  --focus: #ff8fb3; 
  --focus-hover: #ff6b9a; 
  
  --syn: #7bc4c4; 
  --ant: #ff9a9e; 
  
  --c-change: #8bbce6; --c-tech: #b4aee8; --c-pv: #f4a261; --c-col: #d4a5a5; --c-idiom: #e09fbe; --c-wf: #a3c4bc;

  --font-body: "Quicksand", "Nunito", sans-serif;
  --font-head: "Quicksand", "Nunito", sans-serif;
}

html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 130px); scroll-behavior: smooth; }
*, *::before, *::after { box-sizing: inherit; }

body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  /* Hình nền Ghibli (Ponyo) */
  background: url('https://static0.moviewebimages.com/wordpress/wp-content/uploads/2023/02/ponyo-2008-1.jpg') no-repeat center center fixed;
  background-size: cover;
}

/* Lớp phủ filter hồng đào */
body::after {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255, 240, 245, 0.15);
  pointer-events: none;
  z-index: -1;
}

/* Widget Pinterest lơ lửng ở góc */
.melody-widget {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  transform: scale(0.65); 
  transform-origin: bottom right;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 15px 35px rgba(255, 143, 179, 0.4);
  animation: floatWidget 4s ease-in-out infinite;
}

@keyframes floatWidget {
  0%, 100% { transform: scale(0.65) translateY(0); }
  50% { transform: scale(0.65) translateY(-12px); }
}

a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 12px;}

header.top { 
  max-width: 1360px; 
  margin: 20px auto 0; 
  padding: 30px; 
  background: var(--surface);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-radius: 30px; 
  border: 2px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15); 
}
header.top h1 { 
  font-family: var(--font-head); 
  font-size: clamp(1.8rem, 3.4vw, 2.6rem); 
  font-weight: 800; 
  line-height: 1.2; 
  margin: 0 0 10px; 
  color: var(--focus-hover); 
  text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
}
header.top p { margin: 0; color: var(--ink); max-width: 80ch; font-weight: 600; font-size: 1.05rem; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 24px; margin-top: 16px; font-size: .95rem; color: var(--muted); font-weight: 700; }
.legend span b { color: var(--focus-hover); }

.bar {
  position: sticky; top: 15px; z-index: 10;
  max-width: 1360px; margin: 20px auto;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  border: 2px solid rgba(255,255,255,0.9);
  box-shadow: 0 8px 25px rgba(255, 182, 193, 0.25);
}
.bar-in { padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }

/* CSS Dropdown Menu */
.dropdown-wrapper { 
  position: relative; 
  display: inline-block; 
}
.topics-btn { 
  font: inherit; font-size: .95rem; font-weight: 800; 
  padding: 8px 20px; 
  border-radius: 20px; 
  border: 2px solid rgba(255, 182, 193, 0.6); 
  background: var(--focus); 
  color: #fff; 
  cursor: pointer; 
  transition: all 0.3s ease; 
  box-shadow: 0 4px 12px rgba(255, 143, 179, 0.3); 
  display: flex;
  align-items: center;
  gap: 8px;
}
.topics-btn:hover { background: var(--focus-hover); transform: translateY(-2px); }
.topics-dropdown {
  display: none;
  position: absolute;
  top: 115%;
  left: 0;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  min-width: 220px;
  border-radius: 18px;
  border: 2px solid rgba(255, 182, 193, 0.6);
  box-shadow: 0 10px 25px rgba(255, 182, 193, 0.25);
  padding: 8px;
  z-index: 100;
  flex-direction: column;
  gap: 6px;
}
.topics-dropdown.show { display: flex; }
.topics-dropdown button {
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: .9rem;
  font-weight: 700;
  padding: 10px 14px;
  border-radius: 12px;
  border: none;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s ease;
}
.topics-dropdown button:hover { background: var(--surface-2); color: var(--focus-hover); }
.topics-dropdown button[aria-pressed="true"] { background: var(--surface-2); color: var(--focus-hover); font-weight: 800; }

.nav { display: flex; flex-wrap: wrap; gap: 8px; margin-left: 10px; padding-left: 15px; border-left: 2px dashed var(--line); }
.nav a { 
  text-decoration: none; font-size: .9rem; font-weight: 700; 
  padding: 6px 16px; border-radius: 999px; 
  border: 2px solid transparent; color: var(--ink); 
  background: rgba(255,240,245,0.8); 
  transition: all 0.2s ease; 
}
.nav a:hover { border-color: var(--c); color: var(--c); background: #fff; transform: translateY(-1px); }

.search { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.search input { 
  font: inherit; font-size: .95rem; font-weight: 600; 
  padding: 10px 20px; border-radius: 999px; 
  border: 2px solid var(--line); 
  background: rgba(255, 255, 255, 0.9); 
  color: var(--ink); width: min(280px, 60vw); 
  transition: all 0.3s ease; 
}
.search input:focus { background: #fff; border-color: var(--focus-hover); outline: none; box-shadow: 0 0 0 4px rgba(255, 143, 179, 0.2); }
.search input::placeholder { color: #b5b5b5; }
.search .count { font-size: .9rem; font-weight: 800; color: var(--focus-hover); white-space: nowrap; }

main { max-width: 1360px; margin: 0 auto; padding: 0 0 60px; }
section { margin-top: 50px; }
section h2 { 
  font-family: var(--font-head); font-size: 1.8rem; font-weight: 800; 
  margin: 0 0 8px; padding-left: 16px; 
  border-left: 8px solid var(--c); 
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; 
  text-shadow: 0 2px 4px rgba(255,255,255,0.8); 
  border-radius: 4px;
}
section h2 small { font-family: var(--font-body); font-weight: 700; font-size: 1rem; color: var(--focus-hover); background: rgba(255,255,255,0.9); padding: 2px 10px; border-radius: 12px; border: 1px solid var(--line);}
section .lede { 
  margin: 0 0 20px 24px; color: var(--ink); font-weight: 600; font-size: 1.05rem; max-width: 80ch; 
  background: rgba(255,255,255,0.7); padding: 8px 16px; border-radius: 16px; 
  display: inline-block; backdrop-filter: blur(5px);
  border: 1px solid rgba(255,255,255,0.5);
}

.wrap {
  overflow-x: auto;
  border: 2px solid rgba(255,255,255,0.9);
  border-radius: 24px;
  background: var(--surface);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 15px 35px rgba(255, 182, 193, 0.15); 
}
table { border-collapse: collapse; width: 100%; min-width: 1180px; font-size: .95rem; }
thead th { 
  position: sticky; top: 0; 
  background: rgba(255, 240, 245, 0.95); 
  text-align: left; font-weight: 800; padding: 16px 18px; 
  border-bottom: 3px solid var(--c); white-space: nowrap; color: var(--ink); 
  z-index: 2; font-size: 1rem;
}
tbody td { padding: 14px 18px; vertical-align: top; border-bottom: 1px dashed var(--line); transition: background 0.2s ease; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }

td.w { 
  position: sticky; left: 0; 
  background: rgba(255, 255, 255, 0.95); 
  min-width: 140px; max-width: 200px; 
  border-right: 2px dashed rgba(255, 182, 193, 0.4); 
  z-index: 1;
}
tbody tr:hover td.w { background: rgba(255, 245, 248, 1); }
td.w .hw { font-family: var(--font-head); font-weight: 800; font-size: 1.2rem; color: var(--c); line-height: 1.3; overflow-wrap: anywhere; }
td.w .pos { font-style: italic; color: var(--muted); font-size: .85rem; font-weight: 700; margin-top: 4px; display: inline-block; background: rgba(255, 240, 245, 0.8); padding: 2px 8px; border-radius: 8px;}
td.w .phonetic { font-family: var(--font-body); color: var(--focus-hover); font-size: .9rem; font-weight: 800; margin-top: 6px; }
td .vi { margin-top: 6px; font-weight: 800; color: var(--ink); font-size: 1.05rem;}

td .tag { 
  display: inline-block; font-weight: 800; font-size: .8rem; margin-right: 6px; 
  background: rgba(255,255,255,0.9); padding: 3px 10px; border-radius: 12px; 
  border: 1px solid rgba(255, 182, 193, 0.4); 
  box-shadow: 0 2px 4px rgba(255,182,193,0.1);
}
td .tag.s { color: var(--syn); }
td .tag.a { color: var(--ant); }

td div + div { margin-top: 8px; }
td ul.ph { margin: 0; padding-left: 20px; }
td ul.ph li { margin-bottom: 6px; font-weight: 600; }
td ul.ph li::marker { color: var(--focus-hover); }
td b { font-weight: 800; color: var(--ink); }

td.ex { 
  font-style: italic; color: #5a5a5a; font-weight: 600; 
  background: rgba(255, 250, 250, 0.7); 
  padding: 10px 14px; border-radius: 12px; 
  display: inline-block; width: 100%; box-sizing: border-box;
  border-left: 3px solid var(--focus);
}
td.ex b { font-style: normal; color: var(--focus-hover); font-weight: 800; }

.empty { display: none; padding: 30px; color: var(--focus-hover); font-weight: 800; text-align: center; font-size: 1.2rem; background: var(--surface); border-radius: 20px; margin-top: 20px; border: 2px dashed var(--line);}

.topic-title { display: none; font-family: var(--font-head); font-size: 2rem; font-weight: 800; margin: 40px 0 10px; padding-bottom: 10px; border-bottom: 3px dashed var(--focus); color: var(--focus-hover); text-shadow: 0 2px 5px rgba(255,255,255,0.9);}
#app.searching .topic-title { display: block; }

th.c-m, td.c-m { min-width: 250px; }
th.c-s, td.c-s { min-width: 190px; }
th.c-e, td.c-e { min-width: 250px; }
th.c-c, td.c-c { min-width: 230px; }
th.c-n, td.c-n { min-width: 250px; }

::-webkit-scrollbar { width: 14px; height: 14px; }
::-webkit-scrollbar-track { background: rgba(255, 240, 245, 0.6); border-radius: 14px; margin: 6px;}
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--focus), var(--focus-hover)); border-radius: 14px; border: 4px solid rgba(255, 240, 245, 0.8); }
::-webkit-scrollbar-thumb:hover { background: #ff5285; }

@media (max-width:900px){
  header.top { margin: 10px; padding: 20px; border-radius: 20px; }
  .bar { margin: 10px; border-radius: 20px; top: 10px;}
  .nav { border-left: none; padding-left: 0; margin-left: 0; margin-top: 10px; width: 100%; border-top: 2px dashed var(--line); padding-top: 12px;}
  .search { margin-left: 0; width: 100%; margin-top: 10px;}
  .search input { width: 100%; }
  .wrap { border: 0; background: transparent; overflow: visible; box-shadow: none; backdrop-filter: none; }
  table, thead, tbody, tr, td { display: block; min-width: 0; width: 100%; }
  thead { display: none; }
  tbody tr { 
    background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); 
    border: 2px solid rgba(255, 255, 255, 0.9); border-left: 8px solid var(--c); 
    border-radius: 24px; margin-bottom: 20px; padding: 12px 0; 
    box-shadow: 0 8px 20px rgba(255, 182, 193, 0.2); 
  }
  tbody td { border: 0; padding: 10px 20px; min-width: 0!important; max-width: none!important; }
  td.w { position: static; border: 0; background: transparent; padding-bottom: 0;}
  tbody tr:hover td, tbody tr:hover td.w { background: transparent; }
  td[data-l]::before { 
    content: attr(data-l); display: block; font-size: .85rem; font-weight: 800; 
    color: var(--focus-hover); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .melody-widget {
    transform: scale(0.4); 
    bottom: 10px;
    right: 10px;
  }
  @keyframes floatWidget {
    0%, 100% { transform: scale(0.4) translateY(0); }
    50% { transform: scale(0.4) translateY(-8px); }
  }
}
</style>
</head>
<body>
<header class="top">
  <h1>Tổng hợp từ vựng B2 theo chủ đề</h1>
  <p>Ponyo muốn ăn giăm bông, còn cậu muốn chinh phục tiếng Anh! Cùng Ponyo vượt sóng gió, lướt qua mọi từ vựng khó nhằn để đạt điểm thật cao nhé! 🌊🐟✨</p>
  <div class="legend">
    <span><b>Syn.</b> đồng nghĩa hoặc gần nghĩa</span>
    <span><b>Ant.</b> trái nghĩa hoặc đối lập</span>
  </div>
</header>

<div class="bar">
  <div class="bar-in">
    <div id="topics" role="group" aria-label="Chủ đề"></div>
    <nav class="nav" id="nav" aria-label="Các phần"></nav>
    <div class="search">
      <input id="q" type="search" placeholder="Tìm từ, nghĩa tiếng Việt, ví dụ…" aria-label="Tìm trong tất cả chủ đề">
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>
</div>

<main id="app"></main>
<p class="empty" id="none" style="max-width:1400px;margin:0 auto;padding:0 20px 40px">Không có mục nào khớp với từ khóa tìm kiếm.</p>

  ["consider", "consider sth / doing = cân nhắc làm gì¦consider sb for sth = xem xét ai cho vị trí nào¦consider it strange (for sb to do) = coi điều gì là kì lạ", "Have you *considered studying* computer science?", "consider if / whether¦consider sb as sth"],
  ["discuss", "discuss sth / doing (with sb) = thảo luận điều gì với ai", "We need to *discuss buying* a new server with the boss.", "Không dùng discuss about"],
  ["explain", "explain that / explain sth (to sb) = giải thích rằng / giải thích điều gì cho ai", "The teacher *explained* the formula *to* the students.", "Cần có 'to sb' trước tân ngữ chỉ người"],
  ["intend", "intend to do / doing = dự định làm gì", "I *intend to upgrade* my laptop next week.", "have no intention of doing"],
  ["know", "know (about) sth/doing = biết về¦know of sb = biết danh ai¦be known as sth = được biết đến như là", "Thomas Edison is *known as* a brilliant inventor.", "know by heart¦widely known as"],
  ["look", "look at / for sth/sb = nhìn vào; tìm kiếm¦look forward to sth/doing = mong chờ", "I am *looking forward to receiving* the exam results.", "look forward to hearing from you"],
  ["manage", "manage to do = xoay xở làm được việc gì", "Despite the power cut, he *managed to save* his file.", "Syn: succeed in doing"],
  ["plan", "plan sth / plan to do = lên kế hoạch làm việc gì", "The team *plans to launch* the application this winter.", "make a plan"],
  ["possible", "possible (for sb) to do = có thể cho ai làm gì¦find sth possible / find it impossible to do = thấy điều gì là khả thi/bất khả thi", "Modern tech makes it *possible for* us *to work* from home.", "make it possible for sb"],
  ["result", "result of sth/doing = kết quả của¦result in sth = dẫn đến¦result from sth = xuất phát/do từ¦as a result of sth = do từ", "Smoking *results in* serious lung damage.", "result in = cause¦result from = be caused by"],
  ["wonder", "wonder about sth/doing = băn khoăn về cái gì¦wonder if / whether / why = tự hỏi liệu có...", "I *wonder whether* robots will completely replace human workers.", "I wonder if..."]
];

/* ===== Cấu trúc Section của từng Unit ===== */
const UNIT2_SECTIONS = [

  {id:"pv", navLabel:"Phrasal verbs", cls:"--c-pv", title:"Phrasal verbs", lede:"Các cụm động từ quan trọng thường gặp trong chủ đề du lịch và di chuyển.", type:"vocab", data:U2_PHRASAL_VERBS},
  {id:"col", navLabel:"Collocations", cls:"--c-col", title:"Phrases and Collocations", lede:"Các cụm từ khóa kết hợp cố định đi với giới từ.", type:"phrases", data:U2_COLLOCATIONS},
  {id:"wp", navLabel:"Word Patterns", cls:"--c-wf", title:"Word Patterns", lede:"Cấu trúc từ và động từ đi kèm (V-ing / To V / Giới từ).", type:"wp", data:U2_WORD_PATTERNS}

const UNIT4_SECTIONS = [
  {id:"vocab", navLabel:"Topic Vocabulary", cls:"--c-change", title:"Topic Vocabulary in Contrast", lede:"33 từ vựng theo chủ đề Hobbies and Games và phân biệt các từ dễ nhầm lẫn.", type:"vocab", data:U4_VOCAB},
  {id:"pv", navLabel:"Phrasal verbs", cls:"--c-pv", title:"Phrasal verbs", lede:"14 cụm động từ quan trọng thường gặp trong ngữ cảnh giải trí, thể thao và sở thích.", type:"vocab", data:U4_PHRASAL_VERBS},
  {id:"col", navLabel:"Collocations", cls:"--c-col", title:"Phrases and Collocations", lede:"11 cụm từ khóa kết hợp. Chú ý các giới từ đi kèm.", type:"phrases", data:U4_COLLOCATIONS},
  {id:"wp", navLabel:"Word Patterns", cls:"--c-wf", title:"Word Patterns", lede:"13 cấu trúc từ và động từ đi kèm (V-ing / To V / Giới từ). Chú ý cột Lưu ý và phân biệt.", type:"wp", data:U4_WORD_PATTERNS}

const UNIT6_SECTIONS = [
  {id:"vocab", navLabel:"Topic Vocabulary", cls:"--c-change", title:"Topic Vocabulary in Contrast", lede:"Từ vựng theo chủ đề Technology and Inventions và phân biệt các từ dễ nhầm lẫn.", type:"vocab", data:U6_VOCAB},
  {id:"pv", navLabel:"Phrasal verbs", cls:"--c-pv", title:"Phrasal verbs", lede:"14 cụm động từ thường gặp trong ngữ cảnh công nghệ, máy móc và nghiên cứu.", type:"vocab", data:U6_PHRASAL_VERBS},
  {id:"col", navLabel:"Collocations", cls:"--c-col", title:"Phrases and Collocations", lede:"12 cụm từ khóa kết hợp cố định.", type:"phrases", data:U6_COLLOCATIONS},
  {id:"wp", navLabel:"Word Patterns", cls:"--c-wf", title:"Word Patterns", lede:"12 cấu trúc từ và động từ đi kèm (V-ing / To V / Giới từ).", type:"wp", data:U6_WORD_PATTERNS}
];

/* ===== TOPICS ===== */
const TOPICS = [
  {id:"unit2", name:"Unit 2: Travel", sections: UNIT2_SECTIONS},
  {id:"unit4", name:"Unit 4: Hobbies and Games", sections: UNIT4_SECTIONS},
  {id:"unit6", name:"Unit 6: Technology", sections: UNIT6_SECTIONS}
];

/* ===== Logic Render Giao diện ===== */
const app = document.getElementById('app');
const topicBar = document.getElementById('topics');
const nav = document.getElementById('nav');
let current = TOPICS[0].id; 

function fmt(s){ return s.split('|').map(x => x.replace(/\*(.+?)\*/g,'<b>$1</b>')).join('<br>'); }
function items(s){
  return '<ul class="ph">' + s.split('¦').map(x => {
    const i = x.indexOf(' = ');
    return i < 0 ? '<li><b>'+x+'</b></li>' : '<li><b>'+x.slice(0,i)+'</b> — '+x.slice(i+3)+'</li>';
  }).join('') + '</ul>';
}
function synant(syn, ant){
  let h = '';
  if (syn) h += '<div><span class="tag s">Syn.</span>'+syn+'</div>';
  if (ant) h += '<div><span class="tag a">Ant.</span>'+ant+'</div>';
  return h || '<span style="color:var(--muted)">—</span>';
}
function headCells(cols){ return '<tr>'+cols.map(c => '<th class="'+(c[1]||'')+'">'+c[0]+'</th>').join('')+'</tr>'; }

function buildSection(topicId, sec){
  let head, rowsHtml;
  if (sec.type === 'wp') {
    head = headCells([["Từ gốc",""],["Cấu trúc đi kèm (Word Patterns)","c-m"],["Ví dụ","c-e"],["Lưu ý và phân biệt","c-n"]]);
    rowsHtml = sec.data.map(r =>
      '<tr><td class="w" data-l="Từ gốc"><div class="hw">'+r[0]+'</div></td>'+
      '<td class="c-m" data-l="Cấu trúc đi kèm">'+items(r[1])+'</td>'+
      '<td class="c-e ex" data-l="Ví dụ">'+fmt(r[2])+'</td>'+
      '<td class="c-n" data-l="Lưu ý">'+r[3]+'</td></tr>').join('');
  } else {
    const meaningLabel = sec.type === 'phrases' ? 'Cụm trong sách (Anh – Việt)' : 'Nghĩa (Anh – Việt)';
    head = headCells([
      [sec.type === 'phrases' ? 'Từ khóa' : 'Từ',""],
      [meaningLabel,"c-m"],["Synonyms / Antonyms","c-s"],["Ví dụ","c-e"],["Collocations","c-c"],["Sắc thái và ngữ cảnh","c-n"]]);
    
    rowsHtml = sec.data.map(r => {
      const meaning = sec.type === 'phrases'
        ? items(r[2])
        : '<div>'+r[2]+'</div><div class="vi">'+r[3]+'</div>';
        
      const posHtml = r[1] ? '<div class="pos">'+r[1]+'</div>' : '';
      const phoneticHtml = (sec.type === 'vocab' && r[9]) ? '<div class="phonetic">'+r[9]+'</div>' : '';

      return '<tr><td class="w" data-l="'+(sec.type==='phrases'?'Từ khóa':'Từ')+'"><div class="hw">'+r[0]+'</div>'+ phoneticHtml + posHtml+'</td>'+
        '<td class="c-m" data-l="'+meaningLabel+'">'+meaning+'</td>'+
        '<td class="c-s" data-l="Synonyms / Antonyms">'+synant(r[4], r[5])+'</td>'+
        '<td class="c-e ex" data-l="Ví dụ">'+fmt(r[6])+'</td>'+
        '<td class="c-c" data-l="Collocations">'+r[7]+'</td>'+
        '<td class="c-n" data-l="Sắc thái và ngữ cảnh">'+r[8]+'</td></tr>';
    }).join('');
  }
  const el = document.createElement('section');
  el.id = topicId + '-' + sec.id;
  el.style.setProperty('--c', 'var('+sec.cls+')');
  el.innerHTML =
    '<h2>'+sec.title+' <small>'+sec.data.length+' mục</small></h2>'+
    '<p class="lede">'+sec.lede+'</p>'+
    '<div class="wrap"><table><thead>'+head+'</thead><tbody>'+rowsHtml+'</tbody></table></div>';
  return el;
}

// ===== Menu Dropdown Logic =====
const dropdownWrapper = document.createElement('div');
dropdownWrapper.className = 'dropdown-wrapper'; 

const mainBtn = document.createElement('button');
mainBtn.type = 'button';
mainBtn.className = 'topics-btn';
mainBtn.innerHTML = '📚 Chọn Unit 🌸';

const dropdownContent = document.createElement('div');
dropdownContent.className = 'topics-dropdown';

dropdownWrapper.appendChild(mainBtn);
dropdownWrapper.appendChild(dropdownContent);
topicBar.appendChild(dropdownWrapper);

mainBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  dropdownContent.classList.toggle('show');
});

window.addEventListener('click', () => {
  dropdownContent.classList.remove('show');
});

TOPICS.forEach(t => {
  const box = document.createElement('div');
  box.className = 'topic';
  box.dataset.topic = t.id;
  const h = document.createElement('h2');
  h.className = 'topic-title';
  h.textContent = 'Chủ đề: ' + t.name;
  box.appendChild(h);
  t.sections.forEach(sec => box.appendChild(buildSection(t.id, sec)));
  app.appendChild(box);

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = t.name;
  btn.dataset.topic = t.id;
  btn.addEventListener('click', () => {
    setTopic(t.id);
    dropdownContent.classList.remove('show'); 
    mainBtn.innerHTML = '📚 ' + t.name + ' 🌸';
  });
  dropdownContent.appendChild(btn);
});

function buildNav(){
  const t = TOPICS.find(x => x.id === current);
  nav.innerHTML = t.sections.map(s =>
    '<a href="#'+t.id+'-'+s.id+'" style="--c:var('+s.cls+')">'+s.navLabel+'</a>').join('');
}

function setTopic(id){
  current = id;
  const t = TOPICS.find(x => x.id === id);
  if(t) mainBtn.innerHTML = '📚 ' + t.name + ' 🌸';
  buildNav();
  run();
  window.scrollTo({top:0});
}

function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'); }
const rows = Array.from(document.querySelectorAll('tbody tr'));
rows.forEach(tr => { tr._t = norm(tr.textContent); });
const q = document.getElementById('q');
const count = document.getElementById('count');
const none = document.getElementById('none');

function run(){
  const term = norm(q.value.trim());
  const searching = term !== '';
  app.classList.toggle('searching', searching);
  let shown = 0;
  rows.forEach(tr => {
    const ok = !searching || tr._t.indexOf(term) !== -1;
    tr.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  let curCount = 0;
  document.querySelectorAll('.topic').forEach(tp => {
    const isCur = tp.dataset.topic === current;
    let any = false;
    tp.querySelectorAll('section').forEach(sec => {
      const vis = Array.from(sec.querySelectorAll('tbody tr')).some(tr => tr.style.display !== 'none');
      sec.style.display = (searching && !vis) ? 'none' : '';
      if (vis) any = true;
    });
    tp.style.display = searching ? (any ? '' : 'none') : (isCur ? '' : 'none');
    if (isCur) curCount = tp.querySelectorAll('tbody tr').length;
  });
  none.style.display = (searching && shown === 0) ? 'block' : 'none';
  count.textContent = searching ? (shown + ' / ' + rows.length + ' mục') : (curCount + ' mục');
}
q.addEventListener('input', run);

// Khởi chạy khi tải trang
setTopic(current);
</script>
